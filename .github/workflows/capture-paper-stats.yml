name: Capture PAPER stats
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch read-only PAPER telemetry
        run: |
          mkdir -p telemetry
          curl --fail --retry 6 --retry-delay 10 --max-time 30 'https://v405-exitability-production.up.railway.app/stats15' -o telemetry/latest.json
          python -m json.tool telemetry/latest.json >/dev/null
      - name: Commit telemetry snapshot
        run: |
          git config user.name 'paper-stats-bot'
          git config user.email 'paper-stats-bot@users.noreply.github.com'
          git add telemetry/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'telemetry: latest 15m PAPER stats [skip ci]'
          git push
