name: Spot grid candidate smoke
on:
  push:
    branches: [bbb-spot-quarantine-rescue]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Compile
        run: python -m py_compile BBB/spot_quarantine_rescue.py BBB/spot_grid_candidate_machine.py
      - name: Unit tests
        working-directory: BBB
        env: {PYTHONPATH: .}
        run: python -m unittest -v test_spot_quarantine_rescue.py test_spot_grid_candidate_machine.py
