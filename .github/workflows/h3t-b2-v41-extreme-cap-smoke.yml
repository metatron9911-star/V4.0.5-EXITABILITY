name: H3T-B2 v4.1 EXTREME cap smoke

on:
  push:
    branches:
      - bbb-h3t-b2-v4-1-extreme-cap
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile BBB/strategy_cells.py BBB/paper.py BBB/worker.py
      - name: Unit tests
        working-directory: BBB
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_b2_v41_extreme_cap.py
